title: Office Spawns Shell
id: 11111111-1111-1111-1111-111111111111
status: experimental
level: high
author: project team
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
tags:
  - attack.initial_access
  - attack.t1566.001
